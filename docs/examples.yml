- slug: backtesting
  title: Backtesting
  tile: Costed backtests on prices, bars, trades, or quotes, with slippage and fill timing.
  image: recipes__ticks-to-backtest.webp
  alt: Equity curves with and without trading costs
  intro: >-
    Costed backtests on prices, bars, trades, or top-of-book quotes, with fees,
    slippage, fill timing, risk exits, position sizing, and funding.
  functions: >-
    [`BacktestOHLCTarget`](functions_fin/BacktestOHLCTarget.md),
    [`backtest_report`](functions_fin/backtest_report.md),
    [`BacktestCarry`](functions_fin/BacktestCarry.md).
  guides: >-
    [Choosing a backtest engine](functions_fin/choosing_a_backtest_engine.md),
    [Backtesting best practices](backtesting_best_practices.md).
  examples:
  - doc: recipes/ticks-to-backtest
    text: Trades to bars to a signal to a backtest with fees and slippage.
  - doc: notebooks/14-backtesting-a-signal
