- slug: is-it-luck
  title: Is it luck?
  tile: Randomization tests that tell a real edge from a lucky backtest.
  image: notebooks__20-is-the-timing-real.webp
  alt: Statistics of randomly timed copies, with the real backtest marked by a star
  intro: >-
    Tests of whether a backtest result could have come from luck: randomly
    timed copies of the strategy, the whole search rerun on permuted markets,
    and corrections for the number of settings tried.
  functions: >-
    [`position_test`](functions_fin/position_test.md),
    [`strategy_test`](functions_fin/strategy_test.md),
    [`deflated_sharpe`](functions_fin/deflated_sharpe.md),
    [`walk_forward`](functions_fin/walk_forward.md).
  guides: >-
    [Which test when](backtesting_best_practices.md#luck), in the backtesting
    best practices.
  examples:
  - doc: notebooks/20-is-the-timing-real
    text: "`position_test`: your trades against the same trades at random times."
  - doc: notebooks/21-is-the-tuned-result-real
    text: "`strategy_test`: rerun the whole search on permuted markets."
  - doc: notebooks/22-does-the-feature-carry-information
    text: "`strategy_test` with `method=\"shift\"`: misalign a feature and compare."
  - doc: recipes/significance-test
    text: Compare a strategy with randomly timed copies using `position_test`.
  - doc: recipes/parameter-grid
    text: Backtest a grid of parameters at once, map its Sharpe ratios, and correct for the number tried.
  - doc: recipes/walk-forward
    text: Choose a parameter on each training window, trade it on the next, and measure the selection bias.

- slug: portfolios-and-pairs
  title: Portfolios and pairs
  tile: Many assets from one account, cross-sectional ranks, and pairs.
  image: recipes__pairs-trade.webp
  alt: A pairs trade on BTC and ETH with its hedge ratio and spread
  intro: >-
    Rank assets against each other, turn scores into weights, and backtest the
    book from one account with rebalancing, exposure limits, and per-asset
    costs. Pairs trading with a Kalman hedge ratio, a cointegration test, and
    entry and exit bands.
  functions: >-
    [`CrossRank`](functions_cross/CrossRank.md),
    [`CrossNormalize`](functions_cross/CrossNormalize.md),
    [`BacktestPortfolioOHLCTarget`](functions_fin/BacktestPortfolioOHLCTarget.md),
    [`KalmanRegression`](functions_fin/KalmanRegression.md),
    [`BandSignal`](functions_signal/BandSignal.md).
  guides: >-
    [Portfolios and pairs](portfolio_backtesting.md).
  examples:
  - doc: recipes/cross-sectional-momentum
    text: Rank 20 crypto assets by past return, hold a weekly dollar-neutral book with costs, and test it with `position_test`.
  - doc: recipes/pairs-trade
    text: Kalman hedge ratio, cointegration gate, entry and exit bands, and a two-leg portfolio backtest with a significance test.
  - doc: notebooks/18-pairs-and-mean-reversion
    text: Estimate a hedge ratio, extract a stationary spread, and fit an Ornstein-Uhlenbeck model.
  - doc: recipes/multi-asset
    text: Volatility and correlation of several assets with `(T, K)` arrays.

