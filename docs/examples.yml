# Every worked example, grouped by task. devtools/build_examples.py builds the
# "What you can build" page (docs/capabilities.md) and the home page tiles
# (docs/examples_tiles.inc) from this file; tests/test_examples_page.py fails
# when a recipe or notebook is missing here or the generated files are stale.
#
# Each area has:
#   slug       anchor of its section, linked from the home tile
#   title      section and tile title
#   tile       one line under the home tile
#   image      thumbnail under docs/_static/gallery/ for the home tile
#   alt        alt text for that thumbnail
#   intro      paragraph that opens the section
#   functions  markdown line of the functions to start with
#   guides     optional markdown line of longer guides
#   examples   recipes (recipes/<name>) and notebooks (notebooks/<name>), each
#              with one line of text; the card title is the page's own title,
#              and its thumbnail comes from devtools/build_gallery.py

# Pages that already sit in another toctree (the home page's "Get started").
not_in_toctree:
- recipes/first-strategy

areas:
- slug: getting-started
  title: Getting started
  tile: A first costed backtest, and how screamer replaces pandas and TA-Lib calls.
  image: recipes__first-strategy.webp
  alt: Equity curve of a first strategy
  intro: >-
    The first steps: one strategy from prices to a p-value, the screamer
    equivalents of common pandas and TA-Lib calls, and how one operator handles
    scalars, arrays, live streams, and missing values.
  functions: >-
    [`RollingMean`](functions_rolling/RollingMean.md),
    [`BacktestPriceTarget`](functions_fin/BacktestPriceTarget.md),
    [`backtest_report`](functions_fin/backtest_report.md).
  guides: >-
    [Using screamer](usage.md), [Polymorphic API](polymorphic_api.md),
    [NaN and warmup](nan_and_warmup.md).
  examples:
  - doc: recipes/first-strategy
    text: From daily prices to a costed backtest, its statistics, and a p-value.
  - doc: recipes/migrating
    text: The screamer equivalent of common pandas and TA-Lib calls.
  - doc: notebooks/01-quickstart-polymorphic-api
    text: One operator on scalars, arrays, and live streams.
  - doc: notebooks/05-nan-handling
    text: How missing values flow through operators and warm up.

