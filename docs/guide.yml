# Registry of the Guide: parts, chapters, and the pages each chapter lists.
# Run devtools/build_guide.py after editing; it writes the landing pages and the home contents.
parts:
- title: Basics
  chapters:
  - slug: first-steps
    title: First steps
    line: Install screamer, apply a function to arrays and DataFrames, and handle NaN values and warmup.
    tasks:
    - guide/first-steps/install
    - guide/first-steps/first-function
    - guide/first-steps/missing-values
    deeper:
    - notebooks/01-quickstart-polymorphic-api
    - notebooks/05-nan-handling
  - slug: get-data-in
    title: Get your data in
    line: Load OHLCV data, build bars from ticks, and replace pandas, TA-Lib and mlfinlab (AFML) code.
    tasks:
    - guide/get-data-in/ohlcv-dataframe
    - guide/get-data-in/from-pandas-talib
    - guide/get-data-in/from-mlfinlab
    - guide/get-data-in/bars-from-ticks
    deeper:
    - notebooks/09-bars-from-ticks
    - notebooks/10-custom-and-multi-column-bars
- title: Understand a series
  chapters:
  - slug: denoise
    title: Smooth and denoise a series
    line: Moving averages, low-lag and adaptive smoothers (Hull, KAMA, MAMA), Kalman and Butterworth filters, Hampel despiking, and robust outlier detection (median absolute deviation, sigma clipping).
    tasks:
    - guide/denoise/moving-averages
    - guide/denoise/low-lag
    - guide/denoise/adaptive-trend
    - guide/denoise/kalman
    - guide/denoise/lowpass
    - guide/denoise/despike
    - guide/denoise/robust-outliers
    deeper:
    - notebooks/04-signal-processing
    - notebooks/17-filtering-and-forecasting-with-uncertainty
  - slug: volatility
    title: Measure volatility
    line: Close-to-close and OHLC estimators (Yang-Zhang), average true range (ATR), jumps (bipower variation), and weekday seasonality (seasonal z-score, also for hours of the day).
    tasks:
    - guide/volatility/close-to-close
    - guide/volatility/ohlc
    - guide/volatility/atr
    - guide/volatility/jumps
    - guide/volatility/seasonality
    deeper:
    - notebooks/02-window-statistics
  - slug: trend
    title: Detect a trend
    line: Rolling slope (linear regression), moving-average crossover, ADX and directional movement (DMI), and trend mode.
    tasks:
    - guide/trend/slope
    - guide/trend/crossover
    - guide/trend/adx
    - guide/trend/trend-mode
    deeper: []
  - slug: indicators
    title: Compute classic technical indicators
    line: Momentum oscillators (Stochastic RSI, Williams %R, CCI, TRIX, Ultimate Oscillator), MACD, the stochastic oscillator and rate of change (ROC), volume indicators (OBV, MFI, accumulation/distribution, VWAP), and Keltner Channels next to Bollinger Bands (squeeze).
    tasks:
    - guide/indicators/oscillators
    - guide/indicators/macd-stoch
    - guide/indicators/volume
    - guide/indicators/keltner
    deeper:
    - notebooks/03-financial-indicators
  - slug: mean-reversion
    title: Detect mean reversion
    line: Variance ratio test, Hurst exponent, Ornstein-Uhlenbeck (OU) half-life, and z-score bands.
    tasks:
    - guide/mean-reversion/variance-ratio
    - guide/mean-reversion/hurst
    - guide/mean-reversion/half-life
    - guide/mean-reversion/zscore-bands
    deeper:
    - notebooks/18-pairs-and-mean-reversion
  - slug: cycles
    title: Find cycles
    line: Dominant cycle period (Ehlers, Hilbert transform, roofing filter) and cycle turning points (sinewave indicator).
    tasks:
    - guide/cycles/dominant-cycle
    - guide/cycles/turning-points
    deeper:
    - notebooks/19-cycle-and-spectral-analysis
  - slug: regimes
    title: Detect regimes and change points
    line: Hidden Markov models (HMM), Bayesian online changepoint detection, CUSUM filter events, and permutation entropy.
    tasks:
    - guide/regimes/hmm
    - guide/regimes/changepoint
    - guide/regimes/cusum
    - guide/regimes/permutation-entropy
    deeper: []
  - slug: order-flow
    title: Read order flow and liquidity
    line: Trade signing (tick rule), order-flow imbalance (OFI), price impact (Kyle's lambda), Amihud illiquidity, bid-ask spread from bars (EDGE, Corwin-Schultz, Abdi-Ranaldo, Roll), effective and realized spread, VPIN toxicity, micro-price and queue imbalance, and Hawkes trade arrivals.
    tasks:
    - guide/order-flow/sign-trades
    - guide/order-flow/imbalance
    - guide/order-flow/price-impact
    - guide/order-flow/illiquidity
    - guide/order-flow/spread-from-bars
    - guide/order-flow/fill-quality
    - guide/order-flow/vpin
    - guide/order-flow/micro-price
    - guide/order-flow/hawkes
    deeper:
    - notebooks/11-microstructure-order-flow
    - notebooks/12-microstructure-price-impact
    - notebooks/13-microstructure-toxicity-and-book
- title: Build a strategy
  chapters:
  - slug: signal-to-position
    title: Turn a signal into a position
    line: Sign of a signal, entry and exit bands (hysteresis, Schmitt trigger), holding periods, and volatility position sizing.
    tasks:
    - guide/signal-to-position/sign
    - guide/signal-to-position/bands
    - guide/signal-to-position/hold
    - guide/signal-to-position/volatility-sizing
    deeper: []
  - slug: backtest
    title: Backtest a strategy
    line: Backtests on bars, tick trades and bid-ask quotes (L1), the backtest report, fees and slippage, limit and market orders, volume caps (participation), portfolio reports, drawdown, and liquidation distance.
    tasks:
    - guide/backtest/ohlcv
    - guide/backtest/costs
    - guide/backtest/limit-stop-orders
    - guide/backtest/volume-cap
    - guide/backtest/tick-trades
    - guide/backtest/quotes
    - guide/backtest/portfolio-report
    - guide/backtest/drawdown-liquidation
    deeper:
    - notebooks/14-backtesting-a-signal
    - notebooks/15-event-driven-backtests
  - slug: performance
    title: Measure performance and risk
    line: Rolling Sharpe, Sortino, Calmar and Omega ratios, the information ratio, CVaR (expected shortfall) and downside deviation, beta and alpha against a benchmark, and multi-factor regressions.
    tasks:
    - guide/performance/rolling-ratios
    - guide/performance/tail-risk
    - guide/performance/beta-alpha
    - guide/performance/factor-regression
    deeper: []
  - slug: strategies
    title: Strategy templates
    line: Trend following, breakouts, RSI and Bollinger Band reversion, pairs trading, cross-sectional momentum, funding carry, and volatility targeting.
    tasks:
    - guide/strategies/trend-following
    - guide/strategies/breakout
    - guide/strategies/rsi-reversion
    - guide/strategies/bollinger-reversion
    - guide/strategies/pairs
    - guide/strategies/cross-sectional-momentum
    - guide/strategies/carry
    - guide/strategies/volatility-targeting
    deeper: []
  - slug: stops
    title: Stops and exits
    line: Stop-loss, take-profit and trailing-stop exits on a backtest.
    tasks:
    - guide/stops/stops-and-exits
    deeper: []
  - slug: portfolios
    title: Portfolios of many assets
    line: Multi-asset backtests and sizing, cross-sectional z-scores, demeaning and winsorizing, and calculations that restart per day, contract or group (Segment).
    tasks:
    - guide/portfolios/multi-asset
    - guide/portfolios/cross-sectional-scores
    - guide/portfolios/per-group
    deeper: []
- title: Test a strategy
  chapters:
  - slug: not-luck
    title: Check that a backtest result is not luck
    line: Randomization and Monte Carlo permutation tests, block shuffles, time-shifted signals, synthetic price paths, walk-forward testing, parameter grids, and the deflated Sharpe ratio.
    tasks:
    - guide/not-luck/timing-test
    - guide/not-luck/block-shuffle
    - guide/not-luck/shifted-copies
    - guide/not-luck/synthetic-paths
    - guide/not-luck/permutation-test
    - guide/not-luck/walk-forward
    - guide/not-luck/parameter-grid
    - guide/not-luck/deflated-sharpe
    deeper:
    - notebooks/20-is-the-timing-real
    - notebooks/21-is-the-tuned-result-real
    - notebooks/22-does-the-feature-carry-information
  - slug: machine-learning
    title: Prepare data for machine learning
    line: Features, labels (triple barrier), training sets, purged time series cross-validation, and fractional differencing.
    tasks:
    - guide/machine-learning/features
    - guide/machine-learning/fractional-differencing
    - guide/machine-learning/labels
    - guide/machine-learning/training-set
    - guide/machine-learning/time-series-cv
    deeper:
    - notebooks/16-supervised-forecasting
    - notebooks/23-classifying-direction
    - notebooks/24-triple-barrier-labels
    - notebooks/25-meta-labeling
- title: Run a strategy live
  chapters:
  - slug: live
    title: Run on live data
    line: Streaming one value at a time, aligning streams, pipelines, a live trading loop, and JavaScript in the browser.
    tasks:
    - guide/live/one-value-at-a-time
    - guide/live/align-streams
    - guide/live/pipeline
    - guide/live/live-loop
    - guide/live/research-to-live
    - guide/live/browser
    deeper:
    - notebooks/06-streaming-live-events
    - notebooks/07-multi-stream-operators
    - notebooks/08-pipelines
