<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>screamer.js — reading the live tape</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #232a33;
    --fg: #e6edf3; --muted: #8b949e;
    --raw: #6e7681;
    --lowlag: #f5a623; --fair: #58a6ff;
    --buy: #3fb950; --sell: #f85149;
    --live: #3fb950; --warn: #d29922; --dead: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100%;
  }
  header { padding: 16px 20px 8px; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .2px; }
  h1 .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #58a6ff; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 6px 20px 12px; }
  .bar label { color: var(--muted); font-size: 12px; margin-right: 5px; }
  select, button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font-size: 12.5px; cursor: pointer;
  }
  button:hover, select:hover { border-color: #3d4653; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--muted);
  }
  .pill b { color: var(--fg); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--live); box-shadow: 0 0 0 3px rgba(63,185,80,.18); }
  .dot.connecting { background: var(--warn); }
  .dot.dead { background: var(--dead); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #bias.buy  { color: var(--buy); border-color: rgba(63,185,80,.4); }
  #bias.sell { color: var(--sell); border-color: rgba(248,81,73,.4); }
  .grow { flex: 1; }
  #wrap { flex: 1; padding: 0 12px 4px; min-height: 320px; position: relative; }
  canvas { width: 100%; height: 100%; display: block; }
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: var(--muted);
  }
  #overlay .box { max-width: 460px; }
  #overlay code { color: #f0883e; font-family: ui-monospace, Menlo, monospace; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 8px 20px 4px; }
  .lg { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .sw { width: 22px; height: 3px; border-radius: 2px; }
  .sw.sq { width: 11px; height: 11px; border-radius: 2px; }
  .lg .nm { color: var(--muted); }
  .lg .vl { font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
  <header>
    <h1><span class="mono">screamer.js</span> &nbsp;·&nbsp; reading the live tape</h1>
  </header>

  <div class="bar">
    <span><label>market</label>
      <select id="source">
        <option value="coinbase">Coinbase · BTC-USD</option>
        <option value="binance">Binance · BTC/USDT</option>
      </select>
    </span>
    <span><label>view</label>
      <select id="window">
        <option value="count:240" selected>240 trades</option>
        <option value="count:480">480 trades</option>
        <option value="vol:6">volume clock · fine</option>
        <option value="vol:20">volume clock · coarse</option>
      </select>
    </span>
    <span><label>signal</label>
      <select id="signal">
        <option value="flow" selected>order-flow pressure</option>
        <option value="vpin">VPIN · 0.5 BTC buckets</option>
      </select>
    </span>
    <span><label>time</label>
      <select id="timezone">
        <option value="local" selected>local</option>
        <option value="UTC">UTC</option>
      </select>
    </span>
    <span class="grow"></span>
    <span class="pill"><span id="dot" class="dot"></span><span id="status">starting…</span></span>
    <span class="pill">price <b id="last" class="mono">—</b></span>
    <span class="pill" id="bias"><span id="signalLabel">flow</span> <b id="biastxt">—</b></span>
    <span class="pill"><b id="rate">0</b>&nbsp;trades/s</span>
    <span class="pill"><span id="timeInfo">time —</span>&nbsp;·&nbsp;<span id="historyInfo">history 0</span></span>
  </div>

  <div id="wrap">
    <canvas id="chart"></canvas>
    <div id="overlay"><div class="box"></div></div>
  </div>

  <div class="legend">
    <span class="lg"><span class="sw" style="background:var(--lowlag)"></span><span class="nm">low-lag price</span> <span class="vl" id="v_lowlag">—</span></span>
    <span class="lg"><span class="sw" style="background:var(--fair)"></span><span class="nm">fair value (volume-weighted)</span> <span class="vl" id="v_fair">—</span></span>
    <span class="lg"><span class="sw" style="background:var(--raw)"></span><span class="nm">trades</span></span>
    <span class="lg"><span class="sw sq" style="background:var(--buy)"></span><span class="sw sq" style="background:var(--sell)"></span><span class="nm" id="signalLegend">order-flow pressure (buy / sell)</span></span>
  </div>

<script type="module">
// ---------------------------------------------------------------------------
// Load screamer.js. On the docs site a same-origin bundle sits next to this
// page (built to a broad target, most robust across browsers incl. mobile
// Safari); the CDN entries are fallbacks when the file is opened standalone.
// ---------------------------------------------------------------------------
const SOURCES = [
  new URL("./vendor/screamer/index.js", import.meta.url).href,                 // same-origin (docs site)
  "https://cdn.jsdelivr.net/npm/@screamer-labs/screamer@2.2.1/dist/index.js",  // raw published ESM
  "https://esm.sh/@screamer-labs/screamer@2.2.1",                             // transformed fallback
];
async function loadScreamer() {
  const errs = [];
  for (const url of SOURCES) {
    try { return await import(url); }
    catch (e) {
      const where = url.startsWith("http") ? new URL(url).host : "same-origin";
      errs.push(where + " — " + String((e && e.message) || e));
    }
  }
  throw new Error(errs.join("\n"));
}

const overlay = document.getElementById("overlay");
function fail(html) { overlay.querySelector(".box").innerHTML = html; overlay.style.display = "flex"; }

let S;
try {
  S = await loadScreamer();
  await S.ready();
} catch (e) {
  const detail = String((e && e.message) || e)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>");
  fail(`Could not load <code>@screamer-labs/screamer</code>.<br><br>` +
       `This page needs internet access for the module and the trade feed.<br><br>` +
       `<small style="color:#f0883e">${detail}</small>`);
  throw e;
}

// ---------------------------------------------------------------------------
// The signals, all screamer operators fed one trade at a time:
//   low-lag price   RollingPoly1(win, 0)      endpoint of a rolling linear fit
//   fair value      RollingSum(pv)/RollingSum(v)   volume-weighted price (VWMA)
//   order flow      EwMean(signed vol) / EwMean(|vol|)  buy-vs-sell pressure in [-1,1]
// Rebuilt from the browser buffer when the view changes so the chart keeps its history.
// ---------------------------------------------------------------------------
const POLY_WIN = 30, VWMA_WIN = 50, FLOW_SPAN = 50;
const VPIN_BUCKET = 0.5, VPIN_BUCKETS = 20;
const BUFFER_CAPACITY = 5000;
let ops;
function buildOps() {
  ops = {
    poly:  S.RollingPoly1(POLY_WIN, 0),
    sumPV: S.RollingSum(VWMA_WIN),
    sumV:  S.RollingSum(VWMA_WIN),
    ewS:   S.EwMean(undefined, FLOW_SPAN),
    ewA:   S.EwMean(undefined, FLOW_SPAN),
    vpin:  S.VPIN(VPIN_BUCKET, VPIN_BUCKETS),
  };
}
function disposeOps() { if (ops) for (const k in ops) ops[k].dispose(); }

class TradeBuffer {
  constructor(capacity) {
    this.capacity = capacity;
    this.items = new Array(capacity);
    this.start = 0;
    this._size = 0;
  }
  get size() { return this._size; }
  clear() { this.items.fill(undefined); this.start = 0; this._size = 0; }
  push(value) {
    if (this._size < this.capacity) {
      this.items[(this.start + this._size) % this.capacity] = value;
      this._size += 1;
    } else {
      this.items[this.start] = value;
      this.start = (this.start + 1) % this.capacity;
    }
  }
  forEach(fn) {
    for (let i = 0; i < this._size; i++) fn(this.items[(this.start + i) % this.capacity]);
  }
}

const tradeBuffer = new TradeBuffer(BUFFER_CAPACITY);
let N = 240;                 // samples shown
let prices = [], lowlag = [], fair = [], flow = [], vpin = [], times = [];
let vpinLatest = NaN, signalName = "flow";
let lastTrade = null, timeZone = "local";
let dirty = true;
const arrivals = [];

// The clock decides what one plotted sample is: a single trade (count clock), or
// a fixed slice of volume (volume clock). A volume clock collapses a burst of
// micro-trades into a few bars instead of a long stretch of near-flat prints.
let clock = { mode: "count", factor: 0 };
let bucket = null, avgSize = 0;

function resetOperators() {
  disposeOps(); buildOps();
  prices = []; lowlag = []; fair = []; flow = []; vpin = []; times = [];
  vpinLatest = NaN; bucket = null; avgSize = 0;
}
function reset() {
  tradeBuffer.clear(); resetOperators();
  arrivals.length = 0; lastTrade = null;
  document.getElementById("last").textContent = "—";
  dirty = true; updateTimeInfo();
}
function rebuildFromBuffer() {
  resetOperators(); lastTrade = null;
  tradeBuffer.forEach((trade) => processTrade(trade, false));
  dirty = true; updateTimeInfo();
}

resetOperators();

function tradeTimestamp(trade) {
  return Number.isFinite(trade.exchangeTs) ? trade.exchangeTs : trade.receivedTs;
}
function processTrade(trade, remember) {
  if (remember) {
    tradeBuffer.push(trade);
    arrivals.push(performance.now());            // trades/sec counts raw trades
  }
  lastTrade = trade;
  document.getElementById("last").textContent = fmt(trade.price);
  const { price, size, sign } = trade;
  avgSize = avgSize > 0 ? avgSize * 0.99 + size * 0.01 : size;   // slow EWMA, burst-resistant
  const buy = sign > 0 ? size : 0, sell = sign < 0 ? size : 0;
  vpinLatest = ops.vpin(buy, sell);
  const ts = tradeTimestamp(trade);

  if (clock.mode === "count") { addSample(price, size, sign * size, ts); return; }

  // Volume clock: accumulate into a bucket until it holds a target slice of
  // volume, then emit one bar (its VWAP, its volume, its net signed flow).
  if (!bucket) bucket = { vol: 0, signed: 0, pv: 0, ts: NaN };
  bucket.vol += size; bucket.signed += sign * size; bucket.pv += price * size;
  if (Number.isFinite(ts)) bucket.ts = ts;
  if (bucket.vol >= avgSize * clock.factor) {
    addSample(bucket.pv / bucket.vol, bucket.vol, bucket.signed, bucket.ts);
    bucket = null;
  }
}
function onTrade(trade) { processTrade(trade, true); }

// One plotted sample, fed through the operators. `signedVol` is net signed
// volume (sign*size for a single trade, the bucket's net for a volume bar).
function addSample(price, size, signedVol, ts) {
  const ll = ops.poly(price);
  const pv = ops.sumPV(price * size), v = ops.sumV(size);
  const vw = v > 0 ? pv / v : NaN;
  const sv = ops.ewS(signedVol), av = ops.ewA(size);
  const of = av > 0 ? Math.max(-1, Math.min(1, sv / av)) : 0;

  prices.push(price); lowlag.push(ll); fair.push(vw); flow.push(of); vpin.push(vpinLatest); times.push(ts);
  while (prices.length > N) {
    prices.shift(); lowlag.shift(); fair.shift(); flow.shift(); vpin.shift(); times.shift();
  }
  dirty = true;
}

// ---------------------------------------------------------------------------
function parseTimestamp(value) {
  if (typeof value === "number" || (typeof value === "string" && /^\d+(\.\d+)?$/.test(value))) {
    const n = Number(value);
    if (!Number.isFinite(n)) return NaN;
    return n < 1e12 ? n * 1000 : n;
  }
  const n = Date.parse(value);
  return Number.isFinite(n) ? n : NaN;
}

// Public trade feeds. Each yields { price, size, sign } where sign is the
// aggressor: +1 when a buyer lifted the offer, -1 when a seller hit the bid.
// ---------------------------------------------------------------------------
const FEEDS = {
  coinbase: {
    label: "Coinbase BTC-USD",
    url: "wss://ws-feed.exchange.coinbase.com",
    onopen: (ws) => ws.send(JSON.stringify({
      type: "subscribe", product_ids: ["BTC-USD"], channels: ["matches"],
    })),
    parse: (m) => {
      if (m.type !== "match" && m.type !== "last_match") return null;
      const price = parseFloat(m.price), size = parseFloat(m.size);
      if (!Number.isFinite(price) || !Number.isFinite(size)) return null;
      // Coinbase `side` is the resting (maker) side; the aggressor is the opposite.
      return { price, size, sign: m.side === "sell" ? 1 : -1, exchangeTs: parseTimestamp(m.time) };
    },
  },
  binance: {
    label: "Binance BTC/USDT",
    url: "wss://stream.binance.com:9443/ws/btcusdt@trade",
    onopen: null,
    parse: (m) => {
      if (m.e !== "trade") return null;
      const price = parseFloat(m.p), size = parseFloat(m.q);
      if (!Number.isFinite(price) || !Number.isFinite(size)) return null;
      // m.m = buyer is the maker, so the seller is the aggressor.
      return { price, size, sign: m.m ? -1 : 1, exchangeTs: parseTimestamp(m.T) };
    },
  },
};

let ws = null, source = "coinbase", retry = 0, reconnectTimer = null;

function setStatus(state, text) {
  document.getElementById("dot").className = "dot " + (state || "");
  document.getElementById("status").textContent = text;
}
function connect() {
  clearTimeout(reconnectTimer);
  const feed = FEEDS[source];
  setStatus("connecting", "connecting to " + feed.label + "…");
  let sock;
  try { sock = new WebSocket(feed.url); } catch { scheduleReconnect(); return; }
  ws = sock;
  sock.onopen = () => { retry = 0; if (feed.onopen) feed.onopen(sock); setStatus("live", "live · " + feed.label); };
  sock.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    const t = feed.parse(m);
    if (t) onTrade({ ...t, receivedTs: Date.now() });
  };
  sock.onerror = () => { try { sock.close(); } catch {} };
  sock.onclose = () => { if (sock !== ws) return; setStatus("dead", "disconnected · retrying…"); scheduleReconnect(); };
}
function scheduleReconnect() { retry = Math.min(retry + 1, 6); reconnectTimer = setTimeout(connect, 400 * retry); }
function switchFeed(next) { source = next; if (ws) { ws.onclose = null; try { ws.close(); } catch {} ws = null; } reset(); connect(); }

// ---------------------------------------------------------------------------
// Rendering: a price panel (raw trades, low-lag price, fair value) over a slim
// order-flow strip (buy pressure green above zero, sell pressure red below).
// The price axis is scaled from the raw trades only.
// ---------------------------------------------------------------------------
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
let cssW = 0, cssH = 0, dpr = 1;
function resize() {
  const r = canvas.getBoundingClientRect();
  cssW = Math.max(320, r.width); cssH = Math.max(300, r.height);
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dirty = true;
}
window.addEventListener("resize", resize);

const PADL = 12, PADR = 74, PADT = 12, PADB = 34;

function fmt(v) {
  return Number.isFinite(v) ? v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
}
function lastFinite(a) { for (let i = a.length - 1; i >= 0; i--) if (Number.isFinite(a[i])) return a[i]; return NaN; }
const localTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "local";
let cachedTimeFormatter = null, cachedTimeKey = "";
function zoneLabel() {
  if (timeZone === "UTC") return "UTC";
  return localTimeZone;
}
function formatTime(ts, span) {
  if (!Number.isFinite(ts)) return "—";
  const dateKey = span >= 86400000 ? "date" : "time";
  const key = timeZone + ":" + dateKey;
  if (key !== cachedTimeKey) {
    const options = dateKey === "date"
      ? { month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" }
      : { hour: "2-digit", minute: "2-digit", second: "2-digit" };
    options.hour12 = false;
    if (timeZone === "UTC") options.timeZone = "UTC";
    cachedTimeFormatter = new Intl.DateTimeFormat(undefined, options);
    cachedTimeKey = key;
  }
  return cachedTimeFormatter.format(new Date(ts));
}
function timeScale(values) {
  if (values.length < 2 || !Number.isFinite(values[0])) return null;
  for (let i = 1; i < values.length; i++) {
    if (!Number.isFinite(values[i]) || values[i] < values[i - 1]) return null;
  }
  const span = values[values.length - 1] - values[0];
  return span > 0 ? { first: values[0], span } : null;
}
function updateTimeInfo() {
  const kind = lastTrade && Number.isFinite(lastTrade.exchangeTs) ? "trade time" : "arrival time";
  document.getElementById("timeInfo").textContent = kind + " · " + zoneLabel();
  document.getElementById("historyInfo").textContent = tradeBuffer.size + " buffered";
}
// A round tick step (ms) that puts roughly five gridlines across the visible
// span, so labels land on whole seconds / minutes / hours.
function niceTimeStep(span) {
  const steps = [1e3, 2e3, 5e3, 1e4, 15e3, 3e4, 6e4, 12e4, 3e5, 6e5, 9e5, 18e5, 36e5, 72e5, 216e5, 432e5, 864e5];
  const target = span / 5;
  for (const s of steps) if (s >= target) return s;
  return steps[steps.length - 1];
}
function drawTimeAxis(scale, plotW) {
  ctx.strokeStyle = "#232a33"; ctx.fillStyle = "#8b949e";
  ctx.font = "11px ui-monospace, Menlo, monospace"; ctx.textAlign = "center";
  if (scale) {
    // Gridlines are anchored to whole clock times and placed by the same
    // time -> x mapping as the price line, so each fixed instant scrolls left as
    // the window slides and drops off the left while new ticks enter on the right.
    const step = niceTimeStep(scale.span), last = scale.first + scale.span;
    for (let t = Math.ceil(scale.first / step) * step; t <= last; t += step) {
      const x = PADL + (t - scale.first) / scale.span * plotW;
      ctx.beginPath(); ctx.moveTo(x, PADT); ctx.lineTo(x, cssH - PADB + 2); ctx.stroke();
      ctx.fillText(formatTime(t, scale.span), x, cssH - 4);
    }
    ctx.textAlign = "left"; ctx.fillText("trade time · " + zoneLabel(), PADL, cssH - 19);
  } else {
    ctx.textAlign = "left"; ctx.fillText("sample index · timestamp unavailable", PADL, cssH - 4);
  }
}

function render() {
  requestAnimationFrame(render);
  const now = performance.now();
  while (arrivals.length && now - arrivals[0] > 1000) arrivals.shift();
  document.getElementById("rate").textContent = arrivals.length;
  updateTimeInfo();

  if (!dirty) return;
  dirty = false;

  ctx.clearRect(0, 0, cssW, cssH);
  const plotW = cssW - PADL - PADR, plotH = cssH - PADT - PADB;
  const priceH = plotH * 0.70, gap = plotH * 0.07, flowH = plotH - priceH - gap;
  const priceTop = PADT, flowTop = PADT + priceH + gap;

  const finite = prices.filter(Number.isFinite);
  if (finite.length < 2) {
    ctx.fillStyle = "#8b949e"; ctx.font = "13px -apple-system, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("waiting for trades…", PADL + plotW / 2, priceTop + priceH / 2);
    return;
  }

  let lo = Math.min(...finite), hi = Math.max(...finite);
  for (const v of fair) if (Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;

  const len = prices.length, step = plotW / (N - 1);
  const scale = timeScale(times);
  const indexX = (i) => PADL + plotW - (len - 1 - i) * step;
  const X = scale ? (i) => PADL + (times[i] - scale.first) / scale.span * plotW : indexX;
  const Yp = (p) => priceTop + (1 - (p - lo) / (hi - lo)) * priceH;
  const Yf = (v) => flowTop + (1 - (v + 1) / 2) * flowH;
  const zeroY = Yf(0);

  // price grid + right labels
  ctx.strokeStyle = "#232a33"; ctx.fillStyle = "#8b949e"; ctx.lineWidth = 1;
  ctx.font = "11px ui-monospace, Menlo, monospace"; ctx.textAlign = "left";
  for (let k = 0; k <= 4; k++) {
    const y = priceTop + (k / 4) * priceH;
    ctx.beginPath(); ctx.moveTo(PADL, y); ctx.lineTo(PADL + plotW, y); ctx.stroke();
    ctx.fillText(fmt(hi - (k / 4) * (hi - lo)), PADL + plotW + 8, y + 3);
  }

  // price lines, clipped to the price panel
  ctx.save(); ctx.beginPath(); ctx.rect(PADL, priceTop, plotW, priceH); ctx.clip();
  line(prices, "#6e7681", 1, 0.5, X, Yp);
  line(fair,   "#58a6ff", 1.4, 0.9, X, Yp);
  line(lowlag, "#f5a623", 1.9, 1, X, Yp);
  ctx.restore();

  // The lower panel can show either the existing order-flow read or VPIN.
  const nowFlow = lastFinite(flow), nowVpin = lastFinite(vpin);
  document.getElementById("v_lowlag").textContent = fmt(lastFinite(lowlag));
  document.getElementById("v_fair").textContent = fmt(lastFinite(fair));
  const pill = document.getElementById("bias"), txt = document.getElementById("biastxt");
  document.getElementById("signalLabel").textContent = signalName === "vpin" ? "VPIN" : "flow";
  document.getElementById("signalLegend").textContent = signalName === "vpin" ? "VPIN (0–1, higher = more one-sided)" : "order-flow pressure (buy / sell)";
  if (signalName === "vpin") {
    const Yv = (v) => flowTop + (1 - v) * flowH;
    ctx.strokeStyle = "#2c333d"; ctx.beginPath(); ctx.moveTo(PADL, Yv(0.5)); ctx.lineTo(PADL + plotW, Yv(0.5)); ctx.stroke();
    ctx.fillStyle = "#8b949e"; ctx.textAlign = "left"; ctx.fillText("VPIN", PADL + 2, flowTop + 10);
    ctx.font = "11px ui-monospace, Menlo, monospace"; ctx.fillText("1.00", PADL + plotW + 8, flowTop + 3); ctx.fillText("0.00", PADL + plotW + 8, flowTop + flowH + 3);
    line(vpin, "#d29922", 1.8, 1, X, Yv);
    pill.className = "pill"; txt.textContent = Number.isFinite(nowVpin) ? nowVpin.toFixed(2) : "warming up";
  } else {
    // order-flow strip: zero line, green fill above, red fill below
    ctx.strokeStyle = "#2c333d"; ctx.beginPath(); ctx.moveTo(PADL, zeroY); ctx.lineTo(PADL + plotW, zeroY); ctx.stroke();
    ctx.fillStyle = "#8b949e"; ctx.textAlign = "left"; ctx.fillText("order flow", PADL + 2, flowTop + 10);
    fillFlow(flow, X, Yf, zeroY, "#3fb950", PADL, flowTop, plotW, zeroY - flowTop);
    fillFlow(flow, X, Yf, zeroY, "#f85149", PADL, zeroY, plotW, flowTop + flowH - zeroY);
    if (Number.isFinite(nowFlow) && nowFlow > 0.05) { pill.className = "pill buy"; txt.textContent = "buyers " + Math.round(nowFlow * 100) + "%"; }
    else if (Number.isFinite(nowFlow) && nowFlow < -0.05) { pill.className = "pill sell"; txt.textContent = "sellers " + Math.round(-nowFlow * 100) + "%"; }
    else { pill.className = "pill"; txt.textContent = "balanced"; }
  }
  drawTimeAxis(scale, plotW);
}

function line(arr, color, w, alpha, X, Yp) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.globalAlpha = alpha; ctx.lineJoin = "round";
  ctx.beginPath(); let pen = false;
  for (let i = 0; i < arr.length; i++) {
    const v = arr[i];
    if (!Number.isFinite(v)) { pen = false; continue; }
    const x = X(i), y = Yp(v);
    if (pen) ctx.lineTo(x, y); else { ctx.moveTo(x, y); pen = true; }
  }
  ctx.stroke(); ctx.globalAlpha = 1;
}

// Fill the area between the flow line and the zero line, clipped to a rectangle
// so only the above-zero (green) or below-zero (red) part shows.
function fillFlow(arr, X, Yf, zeroY, color, cx, cy, cw, ch) {
  const len = arr.length; if (len < 2) return;
  ctx.save(); ctx.beginPath(); ctx.rect(cx, cy, cw, ch); ctx.clip();
  ctx.fillStyle = color; ctx.globalAlpha = 0.55; ctx.beginPath();
  ctx.moveTo(X(0), zeroY);
  for (let i = 0; i < len; i++) ctx.lineTo(X(i), Yf(Number.isFinite(arr[i]) ? arr[i] : 0));
  ctx.lineTo(X(len - 1), zeroY); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1; ctx.restore();
}

// ---------------------------------------------------------------------------
document.getElementById("source").addEventListener("change", (e) => switchFeed(e.target.value));
document.getElementById("signal").addEventListener("change", (e) => { signalName = e.target.value; rebuildFromBuffer(); });
document.getElementById("timezone").addEventListener("change", (e) => { timeZone = e.target.value; dirty = true; updateTimeInfo(); });
document.getElementById("window").addEventListener("change", (e) => {
  const [t, n] = e.target.value.split(":");
  const next = t === "vol" ? { mode: "volume", factor: +n, N: 240 } : { mode: "count", factor: 0, N: +n };
  clock = { mode: next.mode, factor: next.factor }; N = next.N;
  rebuildFromBuffer();
});

resize();
connect();
requestAnimationFrame(render);
</script>
</body>
