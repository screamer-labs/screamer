<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>screamer.js — live market dashboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #232a33;
    --fg: #e6edf3; --muted: #8b949e;
    --raw: #6e7681;
    --lowlag: #f5a623; --fair: #58a6ff;
    --buy: #3fb950; --sell: #f85149; --ind: #d29922;
    --live: #3fb950; --warn: #d29922; --dead: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100%;
  }
  header { padding: 16px 20px 8px; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .2px; }
  h1 .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #58a6ff; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 6px 20px 12px; }
  .bar label { color: var(--muted); font-size: 12px; margin-right: 5px; }
  select, button.btn {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font-size: 12.5px; cursor: pointer;
  }
  select:hover, button.btn:hover { border-color: #3d4653; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--muted);
  }
  .pill b { color: var(--fg); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--live); box-shadow: 0 0 0 3px rgba(63,185,80,.18); }
  .dot.connecting { background: var(--warn); }
  .dot.dead { background: var(--dead); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .grow { flex: 1; }

  #app { flex: 1; min-height: 0; padding: 0 20px 20px; display: grid; grid-template-columns: minmax(360px, .9fr) minmax(0, 1.5fr); gap: 12px; }
  #leftColumn { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  #leftColumn .bar { padding: 0 0 10px; }
  #dashboard { min-width: 0; min-height: 0; flex: 1; display: flex; }
  #indicatorRail { min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 2px; }
  .category-row { --accent: #8b949e; border-left: 3px solid var(--accent); background: rgba(22,27,34,.55); border-radius: 6px; margin-bottom: 10px; padding: 7px 0 0 9px; }
  .category-row-head { display: flex; align-items: baseline; gap: 8px; padding: 0 8px 5px 0; }
  .category-row-head h2 { color: var(--accent); font-size: 11px; letter-spacing: .5px; margin: 0; text-transform: uppercase; }
  .category-row-head span { color: var(--muted); font-size: 10px; }
  .category-track { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 0 8px 8px 0; scroll-snap-type: x proximity; }
  .category-track::-webkit-scrollbar { height: 7px; }
  .category-track::-webkit-scrollbar-thumb { background: #3d4653; border-radius: 8px; }
  .window {
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
  }
  .window.market { flex: 1; min-height: 320px; }
  .window-head {
    display: flex; align-items: center; gap: 8px; padding: 9px 11px 7px;
    border-bottom: 1px solid var(--line); min-height: 48px;
  }
  .window-head .title { min-width: 0; flex: 1; }
  .window-head h2 { margin: 0; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .window-head .sub { display: block; color: var(--muted); font-size: 10.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .window-head .kicker { color: var(--muted); font-size: 9.5px; letter-spacing: .6px; text-transform: uppercase; }
  .surface { flex: 1; min-height: 0; position: relative; padding: 3px 5px 2px; }
  canvas { width: 100%; height: 100%; display: block; }
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: var(--muted);
  }
  #overlay .box { max-width: 460px; }
  #overlay code { color: #f0883e; font-family: ui-monospace, Menlo, monospace; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 8px 20px 12px; }
  .lg { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .sw { width: 22px; height: 3px; border-radius: 2px; }
  .sw.sq { width: 11px; height: 11px; border-radius: 2px; }
  .lg .nm { color: var(--muted); }
  .lg .vl { font-family: ui-monospace, Menlo, monospace; }

  .indicator-card { --accent: #8b949e; flex: 0 0 220px; height: 158px; scroll-snap-align: start; background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--accent); border-radius: 7px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .indicator-card .card-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 5px; border-bottom: 1px solid var(--line); }
  .indicator-card .card-title { min-width: 0; flex: 1; }
  .indicator-card h3 { margin: 0; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .indicator-card .card-sub { color: var(--accent); display: block; font-size: 9px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .indicator-card .card-value { font: 600 11px ui-monospace, Menlo, monospace; color: var(--fg); white-space: nowrap; }
  .indicator-card .card-value.buy { color: var(--buy); }
  .indicator-card .card-value.sell { color: var(--sell); }
  .indicator-surface { flex: 1; min-height: 78px; position: relative; padding: 2px 3px 2px; }
  @media (max-width: 1100px) {
    #app { grid-template-columns: minmax(300px, .85fr) minmax(0, 1.25fr); }
    .indicator-card { flex-basis: 200px; }
  }
  @media (max-width: 680px) {
    header { padding-left: 12px; padding-right: 12px; }
    #app { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
    #leftColumn, #dashboard, #indicatorRail { width: 100%; }
    #leftColumn { flex: none; }
    #leftColumn .bar { padding: 0 0 8px; }
    #dashboard { flex: none; }
    .window.market { min-height: 330px; }
    #indicatorRail { display: flex; flex-direction: column; overflow: visible; }
    .category-row { margin-bottom: 8px; }
    .category-track { display: grid; grid-template-columns: minmax(0, 1fr); overflow: visible; }
    .indicator-card { width: 100%; flex: none; height: 150px; }
    .indicator-surface { min-height: 78px; }
  }
</style>
</head>
<body>
  <header>
    <h1><span class="mono">screamer.js</span> &nbsp;·&nbsp; live market dashboard</h1>
  </header>

  <main id="app">
    <section id="leftColumn">
      <div class="bar">
    <span><label>market</label>
      <select id="source">
        <option value="coinbase">Coinbase · BTC-USD</option>
        <option value="binance">Binance · BTC/USDT</option>
      </select>
    </span>
    <span><label>bars</label>
      <select id="window">
        <option value="count:240">240 trades</option>
        <option value="count:480">480 trades</option>
        <option value="time:10" selected>10-second bars</option>
        <option value="vol:6">volume clock · fine</option>
        <option value="vol:20">volume clock · coarse</option>
      </select>
    </span>
    <span><label>time</label>
      <select id="timezone">
        <option value="local" selected>local</option>
        <option value="UTC">UTC</option>
      </select>
    </span>
    <span class="grow"></span>
    <span class="pill"><span id="dot" class="dot"></span><span id="status">starting…</span></span>
    <span class="pill">price <b id="last" class="mono">—</b></span>
    <span class="pill">indicators <b id="indicatorCount">0</b></span>
    <span class="pill"><b id="rate">0</b>&nbsp;trades/s</span>
    <span class="pill"><span id="timeInfo">time —</span>&nbsp;·&nbsp;<span id="historyInfo">history 0</span></span>
      </div>
      <div id="dashboard">
      <section class="window market">
        <div class="window-head">
          <div class="title"><span class="kicker">market overview</span><h2 id="marketTitle">BTC-USD · 10-second OHLC</h2><span class="sub">price, low-lag estimate, fair value and aggressor volume</span></div>
        </div>
        <div class="surface"><canvas id="chartPrice"></canvas><div id="overlay"><div class="box"></div></div></div>
        <div class="legend">
          <span class="lg"><span class="sw" style="background:var(--lowlag)"></span><span class="nm">low-lag price</span> <span class="vl" id="v_lowlag">—</span></span>
          <span class="lg"><span class="sw" style="background:var(--fair)"></span><span class="nm">fair value</span> <span class="vl" id="v_fair">—</span></span>
          <span class="lg"><span class="sw" style="background:var(--raw)"></span><span class="nm">close</span></span>
          <span class="lg"><span class="sw sq" style="background:var(--buy)"></span><span class="sw sq" style="background:var(--sell)"></span><span class="nm">buy / sell volume</span></span>
        </div>
      </section>

      </div>
    </section>
    <aside id="indicatorRail" aria-label="Screamer indicators by category"></aside>
  </main>

<script type="module">
// ---------------------------------------------------------------------------
// Load screamer.js. On the docs site a same-origin bundle sits next to this
// page (built to a broad target, most robust across browsers incl. mobile
// Safari); the CDN entries are fallbacks when the file is opened standalone.
// ---------------------------------------------------------------------------
const SOURCES = [
  new URL("./vendor/screamer/index.js", import.meta.url).href,                 // same-origin (docs site)
  "https://cdn.jsdelivr.net/npm/@screamer-labs/screamer@2.3.0/dist/index.js",  // raw published ESM
  "https://esm.sh/@screamer-labs/screamer@2.3.0",                             // transformed fallback
];
async function loadScreamer() {
  const errs = [];
  for (const url of SOURCES) {
    try { return await import(url); }
    catch (e) {
      const where = url.startsWith("http") ? new URL(url).host : "same-origin";
      errs.push(where + " — " + String((e && e.message) || e));
    }
  }
  throw new Error(errs.join("\n"));
}

const overlay = document.getElementById("overlay");
function fail(html) { overlay.querySelector(".box").innerHTML = html; overlay.style.display = "flex"; }

let S;
try {
  S = await loadScreamer();
  await S.ready();
} catch (e) {
  const detail = String((e && e.message) || e)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\n/g, "<br>");
  fail(`Could not load <code>@screamer-labs/screamer</code>.<br><br>` +
       `This page needs internet access for the module and the trade feed.<br><br>` +
       `<small style="color:#f0883e">${detail}</small>`);
  throw e;
}

// ---------------------------------------------------------------------------
// The dashboard shows OHLC prices, volume, and synchronized Screamer
// indicator cards. Each indicator is fed one sample at a time;
// `feed` receives { price, size, signed, buy, sell } where signed is the
// aggressor sign times size.
// ---------------------------------------------------------------------------
const POLY_WIN = 30, VWMA_WIN = 50, FLOW_SPAN = 50, BUFFER_CAPACITY = 5000;

// helpers to keep the registry terse
const price  = (mk) => ({ make: () => ({ op: mk() }), feed: (o, s) => o.op(s.price) });
const signed = (mk) => ({ make: () => ({ op: mk() }), feed: (o, s) => o.op(s.signed) });

const INDICATORS = [
  // --- Order flow & volume ---------------------------------------------------
  { id: "flow", group: "Order flow & volume", label: "Order-flow pressure", short: "flow", style: "flow",
    make: () => ({ eS: S.EwMean(undefined, FLOW_SPAN), eA: S.EwMean(undefined, FLOW_SPAN) }),
    feed: (o, s) => { const sv = o.eS(s.signed), av = o.eA(s.size); return av > 0 ? Math.max(-1, Math.min(1, sv / av)) : 0; } },
  { id: "vpin", group: "Order flow & volume", label: "VPIN · 0.5 BTC buckets", short: "VPIN", fixed: [0, 1], refs: [0.5],
    make: () => ({ op: S.VPIN(0.5, 20) }), feed: (o, s) => o.op(s.buy, s.sell) },
  { id: "cvd", group: "Order flow & volume", label: "Cumulative volume delta", short: "CVD", refs: [0], ...signed(() => S.CumSum()) },
  { id: "imbalance", group: "Order flow & volume", label: "Trade imbalance", short: "imbal", fixed: [-1, 1], refs: [0],
    make: () => ({ sumS: S.RollingSum(60), sumA: S.RollingSum(60) }),
    feed: (o, s) => { const a = o.sumA(s.size); return a > 0 ? Math.max(-1, Math.min(1, o.sumS(s.signed) / a)) : 0; } },
  { id: "bvc", group: "Order flow & volume", label: "Bulk-volume classifier", short: "BVC", ...price(() => S.BulkVolumeClassifier(30)) },

  // --- Momentum --------------------------------------------------------------
  { id: "rsi", group: "Momentum", label: "RSI", short: "RSI", fixed: [0, 100], refs: [30, 70], ...price(() => S.RollingRSI(14)) },
  { id: "roc", group: "Momentum", label: "Rate of change", short: "ROC", refs: [0], ...price(() => S.ROC(20)) },
  { id: "momentum", group: "Momentum", label: "Momentum", short: "mom", refs: [0], ...price(() => S.Momentum(20)) },
  { id: "trix", group: "Momentum", label: "TRIX", short: "TRIX", refs: [0], ...price(() => S.TRIX(20)) },
  { id: "zscore", group: "Momentum", label: "Rolling z-score", short: "z", refs: [0], ...price(() => S.RollingZscore(50)) },

  // --- Trend -----------------------------------------------------------------
  { id: "slope", group: "Trend", label: "Low-lag slope", short: "slope", refs: [0], ...price(() => S.RollingPoly1(30, 1)) },
  { id: "detrend", group: "Trend", label: "Detrended price", short: "detr", refs: [0], ...price(() => S.Detrend(40)) },
  { id: "trendmode", group: "Trend", label: "Ehlers trend-mode", short: "trend?", fixed: [-0.1, 1.1], refs: [0.5], ...price(() => S.TrendMode()) },
  { id: "fracdiff", group: "Trend", label: "Fractional difference", short: "fracΔ", refs: [0], ...price(() => S.FracDiff(0.4, 100)) },
  { id: "instrend", group: "Trend", label: "Instantaneous-trend gap", short: "IT gap", refs: [0],
    make: () => ({ op: S.InstantaneousTrendline() }), feed: (o, s) => s.price - o.op(s.price) },

  // --- Volatility ------------------------------------------------------------
  { id: "std", group: "Volatility", label: "Rolling volatility", short: "σ", ...price(() => S.RollingStd(30)) },
  { id: "range", group: "Volatility", label: "Rolling range", short: "range", ...price(() => S.RollingRange(30)) },
  { id: "absret", group: "Volatility", label: "Abs log-return", short: "|ret|",
    make: () => ({ op: S.LogReturn(1) }), feed: (o, s) => Math.abs(o.op(s.price)) },

  // --- Cycle (Ehlers) --------------------------------------------------------
  { id: "domcycle", group: "Cycle (Ehlers)", label: "Dominant cycle period", short: "cycle", ...price(() => S.DominantCycle()) },
  { id: "cycleamp", group: "Cycle (Ehlers)", label: "Cycle amplitude", short: "amp", ...price(() => S.CycleAmplitude()) },
  { id: "cyclephase", group: "Cycle (Ehlers)", label: "Cycle phase", short: "phase", refs: [0], ...price(() => S.CyclePhase()) },
  { id: "cyclefreq", group: "Cycle (Ehlers)", label: "Cycle frequency", short: "freq", ...price(() => S.CycleFrequency()) },
];
const INDICATOR_BY_ID = Object.fromEntries(INDICATORS.map((d) => [d.id, d]));
let indicatorSlots = [];
let priceOps;
function buildPriceOps() { priceOps = { poly: S.RollingPoly1(POLY_WIN, 0), sumPV: S.RollingSum(VWMA_WIN), sumV: S.RollingSum(VWMA_WIN) }; }
function disposePriceOps() { if (priceOps) for (const k in priceOps) priceOps[k].dispose(); }
function disposeState(state) { if (state) for (const k in state) state[k].dispose(); }
function buildIndicatorSlots() {
  indicatorSlots = INDICATORS.map((def) => ({ id: def.id, state: def.make(), values: [] }));
}
function disposeIndicatorSlots() {
  for (const slot of indicatorSlots) { disposeState(slot.state); slot.state = null; slot.values = []; }
  indicatorSlots = [];
}

class TradeBuffer {
  constructor(capacity) { this.capacity = capacity; this.items = new Array(capacity); this.start = 0; this._size = 0; }
  get size() { return this._size; }
  clear() { this.items.fill(undefined); this.start = 0; this._size = 0; }
  push(value) {
    if (this._size < this.capacity) { this.items[(this.start + this._size) % this.capacity] = value; this._size += 1; }
    else { this.items[this.start] = value; this.start = (this.start + 1) % this.capacity; }
  }
  forEach(fn) { for (let i = 0; i < this._size; i++) fn(this.items[(this.start + i) % this.capacity]); }
}

// Keep a separate bounded replay buffer for each market. Switching feeds can
// therefore restore the most recent view without mixing trades from markets.
const marketBuffers = new Map();
function bufferForMarket(market) {
  let buffer = marketBuffers.get(market);
  if (!buffer) {
    buffer = new TradeBuffer(BUFFER_CAPACITY);
    marketBuffers.set(market, buffer);
  }
  return buffer;
}
let tradeBuffer = bufferForMarket("coinbase");
let N = 240;                 // samples shown
let opens = [], highs = [], lows = [], prices = [], lowlag = [], fair = [], buyVol = [], sellVol = [], times = [];
let lastTrade = null, timeZone = "local";
let dirty = true;
const arrivals = [];

// The clock decides what one plotted sample is: a trade, a timestamped bar, or
// a fixed slice of volume.
let clock = { mode: "time", factor: 10 };
let bucket = null, avgSize = 0;
const marketStates = new Map();

function seriesClockKey() { return clock.mode + ":" + clock.factor + ":" + N; }
function captureActiveSeries() {
  marketStates.set(source, {
    priceOps, indicatorSlots,
    opens, highs, lows, prices, lowlag, fair, buyVol, sellVol, times,
    lastTrade, bucket, avgSize,
    clockKey: seriesClockKey(),
  });
}
function restoreSeries(state) {
  priceOps = state.priceOps; indicatorSlots = state.indicatorSlots;
  opens = state.opens; highs = state.highs; lows = state.lows; prices = state.prices;
  lowlag = state.lowlag; fair = state.fair; buyVol = state.buyVol; sellVol = state.sellVol; times = state.times;
  lastTrade = state.lastTrade; bucket = state.bucket; avgSize = state.avgSize;
  document.getElementById("last").textContent = lastTrade ? fmt(lastTrade.price) : "—";
}
function disposeSeries(state) {
  if (!state) return;
  if (state.priceOps) for (const op of Object.values(state.priceOps)) op.dispose();
  if (state.indicatorSlots) for (const slot of state.indicatorSlots) disposeState(slot.state);
}

function resetOperators(dispose = true) {
  if (dispose) { disposePriceOps(); disposeIndicatorSlots(); }
  buildPriceOps(); buildIndicatorSlots();
  opens = []; highs = []; lows = []; prices = []; lowlag = []; fair = []; buyVol = []; sellVol = []; times = [];
  bucket = null; avgSize = 0;
}
function resetActiveSeries() {
  // A cached state may hold the same operator instances. It is invalid once
  // this series is rebuilt, so remove it before disposing those instances.
  const cached = marketStates.get(source);
  if (cached && cached.priceOps === priceOps) marketStates.delete(source);
  resetOperators();
  arrivals.length = 0;
  lastTrade = null;
  document.getElementById("last").textContent = "—";
  dirty = true;
  updateTimeInfo();
}
function reset() {
  tradeBuffer.clear();
  resetActiveSeries();
}
function rebuildFromBuffer() {
  resetActiveSeries();
  tradeBuffer.forEach((trade) => processTrade(trade, false));
  dirty = true; updateTimeInfo();
}
resetOperators();

function tradeTimestamp(trade) { return Number.isFinite(trade.exchangeTs) ? trade.exchangeTs : trade.receivedTs; }

function flushTimeBucket() {
  if (!bucket || bucket.vol <= 0) return;
  addSample({
    price: bucket.close, open: bucket.open, high: bucket.high, low: bucket.low,
    size: bucket.vol, signed: bucket.signed, buy: bucket.buy, sell: bucket.sell, ts: bucket.ts,
  });
  bucket = null;
}

function processTrade(trade, remember) {
  if (remember) { tradeBuffer.push(trade); arrivals.push(performance.now()); dirty = true; }
  lastTrade = trade;
  document.getElementById("last").textContent = fmt(trade.price);
  const { price, size, sign } = trade;
  avgSize = avgSize > 0 ? avgSize * 0.99 + size * 0.01 : size;   // slow EWMA, burst-resistant
  const ts = tradeTimestamp(trade);

  if (clock.mode === "count") {
    addSample({ price, open: price, high: price, low: price, size, signed: sign * size, buy: sign > 0 ? size : 0, sell: sign < 0 ? size : 0, ts });
    return;
  }

  if (clock.mode === "time") {
    const span = clock.factor * 1000;
    const start = Number.isFinite(ts) ? Math.floor(ts / span) * span : NaN;
    if (!bucket || bucket.start !== start) {
      flushTimeBucket();
      bucket = { start, open: price, high: price, low: price, close: price, vol: 0, signed: 0, buy: 0, sell: 0, ts };
    }
    bucket.high = Math.max(bucket.high, price); bucket.low = Math.min(bucket.low, price); bucket.close = price;
    bucket.vol += size; bucket.signed += sign * size;
    bucket.buy += sign > 0 ? size : 0; bucket.sell += sign < 0 ? size : 0;
    bucket.ts = ts;
    return;
  }

  // Volume clock: accumulate into a bucket until it holds a target slice of volume.
  if (!bucket) bucket = { open: price, high: price, low: price, close: price, vol: 0, signed: 0, pv: 0, buy: 0, sell: 0, ts: NaN };
  bucket.high = Math.max(bucket.high, price); bucket.low = Math.min(bucket.low, price); bucket.close = price;
  bucket.vol += size; bucket.signed += sign * size; bucket.pv += price * size;
  bucket.buy += sign > 0 ? size : 0; bucket.sell += sign < 0 ? size : 0;
  if (Number.isFinite(ts)) bucket.ts = ts;
  if (bucket.vol >= avgSize * clock.factor) {
    addSample({ price: bucket.pv / bucket.vol, open: bucket.open, high: bucket.high, low: bucket.low, size: bucket.vol, signed: bucket.signed, buy: bucket.buy, sell: bucket.sell, ts: bucket.ts });
    bucket = null;
  }
}
function onTrade(trade) { processTrade(trade, true); }

function addSample(s) {
  const ll = priceOps.poly(s.price);
  const pv = priceOps.sumPV(s.price * s.size), v = priceOps.sumV(s.size);
  const vw = v > 0 ? pv / v : NaN;
  const open = Number.isFinite(s.open) ? s.open : s.price;
  const high = Number.isFinite(s.high) ? s.high : s.price;
  const low = Number.isFinite(s.low) ? s.low : s.price;
  opens.push(open); highs.push(high); lows.push(low);
  prices.push(s.price); lowlag.push(ll); fair.push(vw);
  buyVol.push(s.buy); sellVol.push(s.sell); times.push(s.ts);
  indicatorSlots.forEach((slot) => slot.values.push(INDICATOR_BY_ID[slot.id].feed(slot.state, s)));
  while (prices.length > N) {
    opens.shift(); highs.shift(); lows.shift(); prices.shift(); lowlag.shift(); fair.shift(); buyVol.shift(); sellVol.shift(); times.shift();
    indicatorSlots.forEach((slot) => slot.values.shift());
  }
  dirty = true;
}

// ---------------------------------------------------------------------------
function parseTimestamp(value) {
  if (typeof value === "number" || (typeof value === "string" && /^\d+(\.\d+)?$/.test(value))) {
    const n = Number(value);
    if (!Number.isFinite(n)) return NaN;
    return n < 1e12 ? n * 1000 : n;
  }
  const n = Date.parse(value);
  return Number.isFinite(n) ? n : NaN;
}

// Public trade feeds. Each yields { price, size, sign } where sign is the
// aggressor: +1 when a buyer lifted the offer, -1 when a seller hit the bid.
// ---------------------------------------------------------------------------
const FEEDS = {
  coinbase: {
    label: "Coinbase BTC-USD",
    url: "wss://ws-feed.exchange.coinbase.com",
    onopen: (ws) => ws.send(JSON.stringify({ type: "subscribe", product_ids: ["BTC-USD"], channels: ["matches"] })),
    parse: (m) => {
      if (m.type !== "match" && m.type !== "last_match") return null;
      const price = parseFloat(m.price), size = parseFloat(m.size);
      if (!Number.isFinite(price) || !Number.isFinite(size)) return null;
      return { price, size, sign: m.side === "sell" ? 1 : -1, exchangeTs: parseTimestamp(m.time) };
    },
  },
  binance: {
    label: "Binance BTC/USDT",
    url: "wss://stream.binance.com:9443/ws/btcusdt@trade",
    onopen: null,
    parse: (m) => {
      if (m.e !== "trade") return null;
      const price = parseFloat(m.p), size = parseFloat(m.q);
      if (!Number.isFinite(price) || !Number.isFinite(size)) return null;
      return { price, size, sign: m.m ? -1 : 1, exchangeTs: parseTimestamp(m.T) };
    },
  },
};

let ws = null, source = "coinbase", retry = 0, reconnectTimer = null;

function setStatus(state, text) {
  document.getElementById("dot").className = "dot " + (state || "");
  document.getElementById("status").textContent = text;
}
function connect() {
  clearTimeout(reconnectTimer);
  const feed = FEEDS[source];
  setStatus("connecting", "connecting to " + feed.label + "…");
  let sock;
  try { sock = new WebSocket(feed.url); } catch { scheduleReconnect(); return; }
  ws = sock;
  sock.onopen = () => { retry = 0; if (feed.onopen) feed.onopen(sock); setStatus("live", "live · " + feed.label); };
  sock.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    const t = feed.parse(m);
    if (t) onTrade({ ...t, receivedTs: Date.now() });
  };
  sock.onerror = () => { try { sock.close(); } catch {} };
  sock.onclose = () => { if (sock !== ws) return; setStatus("dead", "disconnected · retrying…"); scheduleReconnect(); };
}
function scheduleReconnect() { retry = Math.min(retry + 1, 6); reconnectTimer = setTimeout(connect, 400 * retry); }
function viewLabel() {
  if (clock.mode === "time") return clock.factor + "-second OHLC";
  if (clock.mode === "volume") return "volume-clock bars";
  return "trade view";
}
function updateMarketTitle() {
  document.getElementById("marketTitle").textContent = FEEDS[source].label + " · " + viewLabel();
}
function switchFeed(next) {
  if (!FEEDS[next] || next === source) return;
  if (ws) { ws.onclose = null; try { ws.close(); } catch {} ws = null; }
  captureActiveSeries();
  source = next;
  tradeBuffer = bufferForMarket(source);
  const cached = marketStates.get(source);
  const canRestore = cached && cached.clockKey === seriesClockKey();
  if (canRestore) {
    restoreSeries(cached);
  } else {
    if (cached) { marketStates.delete(source); disposeSeries(cached); }
    resetOperators(false);
    lastTrade = null;
    document.getElementById("last").textContent = "—";
    rebuildFromBuffer();
  }
  arrivals.length = 0;
  updateMarketTitle();
  dirty = true;
  updateTimeInfo();
  connect();
}

// ---------------------------------------------------------------------------
// Rendering: one market canvas plus one compact canvas for every registered
// indicator. All cards share the same sample clock and bounded replay buffer.
// ---------------------------------------------------------------------------
const canvases = {
  price: document.getElementById("chartPrice"),
};
const indicatorCanvases = new Map();
let ctx = null;
let cssW = 0, cssH = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  for (const canvas of [...Object.values(canvases), ...indicatorCanvases.values()]) {
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
  }
  dirty = true;
}
function useSurface(name) {
  const canvas = canvases[name] || indicatorCanvases.get(name);
  if (!canvas) throw new Error("Unknown chart surface: " + name);
  const r = canvas.getBoundingClientRect();
  cssW = Math.max(180, r.width); cssH = Math.max(120, r.height);
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
}
window.addEventListener("resize", resize);

const PADL = 10, PADR = 58, PADT = 10, PADB = 25;

function fmt(v) { return Number.isFinite(v) ? v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—"; }
function fmtTick(v) {
  if (!Number.isFinite(v)) return "—";
  const a = Math.abs(v), d = a >= 1000 ? 0 : a >= 1 ? 2 : a >= 0.01 ? 4 : 6;
  return v.toFixed(d);
}
function lastFinite(a) { for (let i = a.length - 1; i >= 0; i--) if (Number.isFinite(a[i])) return a[i]; return NaN; }
const localTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "local";
let cachedTimeFormatter = null, cachedTimeKey = "";
function zoneLabel() { return timeZone === "UTC" ? "UTC" : localTimeZone; }
function formatTime(ts, span) {
  if (!Number.isFinite(ts)) return "—";
  const dateKey = span >= 86400000 ? "date" : "time";
  const key = timeZone + ":" + dateKey;
  if (key !== cachedTimeKey) {
    const options = dateKey === "date"
      ? { month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" }
      : { hour: "2-digit", minute: "2-digit", second: "2-digit" };
    options.hour12 = false;
    if (timeZone === "UTC") options.timeZone = "UTC";
    cachedTimeFormatter = new Intl.DateTimeFormat(undefined, options);
    cachedTimeKey = key;
  }
  return cachedTimeFormatter.format(new Date(ts));
}
function timeScale(values) {
  if (values.length < 2 || !Number.isFinite(values[0])) return null;
  for (let i = 1; i < values.length; i++) if (!Number.isFinite(values[i]) || values[i] < values[i - 1]) return null;
  const span = values[values.length - 1] - values[0];
  return span > 0 ? { first: values[0], span } : null;
}
function updateTimeInfo() {
  const kind = lastTrade && Number.isFinite(lastTrade.exchangeTs) ? "trade time" : "arrival time";
  document.getElementById("timeInfo").textContent = kind + " · " + zoneLabel();
  document.getElementById("historyInfo").textContent = tradeBuffer.size + " buffered";
}
function niceTimeStep(span) {
  const steps = [1e3, 2e3, 5e3, 1e4, 15e3, 3e4, 6e4, 12e4, 3e5, 6e5, 9e5, 18e5, 36e5, 72e5, 216e5, 432e5, 864e5];
  const target = span / 5;
  for (const s of steps) if (s >= target) return s;
  return steps[steps.length - 1];
}
function drawTimeAxis(scale, plotW) {
  ctx.strokeStyle = "#232a33"; ctx.fillStyle = "#8b949e";
  ctx.font = "11px ui-monospace, Menlo, monospace"; ctx.textAlign = "center";
  if (scale) {
    const step = niceTimeStep(scale.span), last = scale.first + scale.span;
    for (let t = Math.ceil(scale.first / step) * step; t <= last; t += step) {
      const x = PADL + (t - scale.first) / scale.span * plotW;
      ctx.beginPath(); ctx.moveTo(x, PADT); ctx.lineTo(x, cssH - PADB + 2); ctx.stroke();
      ctx.fillText(formatTime(t, scale.span), x, cssH - 4);
    }
    ctx.textAlign = "left"; ctx.fillText("trade time · " + zoneLabel(), PADL, cssH - 19);
  } else {
    ctx.textAlign = "left"; ctx.fillText("sample index · timestamp unavailable", PADL, cssH - 4);
  }
}

function render() {
  requestAnimationFrame(render);
  const now = performance.now();
  while (arrivals.length && now - arrivals[0] > 1000) arrivals.shift();
  document.getElementById("rate").textContent = arrivals.length;
  updateTimeInfo();

  if (clock.mode === "time" && bucket && Number.isFinite(bucket.start) && Date.now() >= bucket.start + clock.factor * 1000) flushTimeBucket();
  if (!dirty) return;
  dirty = false;
  renderPricePanel();
  renderIndicatorPanels();
}

function sampleX(plotW) {
  const len = prices.length, scale = timeScale(times);
  const step = plotW / Math.max(len - 1, 1);
  const indexX = (i) => PADL + plotW - (len - 1 - i) * step;
  return { scale, X: scale ? (i) => PADL + (times[i] - scale.first) / scale.span * plotW : indexX };
}

function renderPricePanel() {
  useSurface("price");
  const plotW = cssW - PADL - PADR, plotH = cssH - PADT - PADB;
  const gap = Math.max(7, plotH * 0.035), priceH = plotH * 0.68, volumeH = plotH - priceH - gap;
  const volumeTop = PADT + priceH + gap;
  const finite = [...highs, ...lows, ...prices, ...fair, ...lowlag].filter(Number.isFinite);
  if (finite.length < 2) {
    ctx.fillStyle = "#8b949e"; ctx.font = "13px -apple-system, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("waiting for trades…", PADL + plotW / 2, PADT + priceH / 2);
    return;
  }
  let lo = Math.min(...finite), hi = Math.max(...finite);
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const { scale, X } = sampleX(plotW);
  const Yp = (p) => PADT + (1 - (p - lo) / (hi - lo)) * priceH;
  ctx.strokeStyle = "#232a33"; ctx.fillStyle = "#8b949e"; ctx.lineWidth = 1;
  ctx.font = "10px ui-monospace, Menlo, monospace"; ctx.textAlign = "left";
  for (let k = 0; k <= 4; k++) {
    const y = PADT + (k / 4) * priceH;
    ctx.beginPath(); ctx.moveTo(PADL, y); ctx.lineTo(PADL + plotW, y); ctx.stroke();
    ctx.fillText(fmt(hi - (k / 4) * (hi - lo)), PADL + plotW + 6, y + 3);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(PADL, PADT, plotW, priceH); ctx.clip();
  renderOHLC(X, Yp, plotW);
  line(prices, "#6e7681", 1, 0.45, X, Yp);
  line(fair, "#58a6ff", 1.4, 0.9, X, Yp);
  line(lowlag, "#f5a623", 1.9, 1, X, Yp);
  ctx.restore();
  renderVolume(volumeTop, volumeH, X, plotW);
  document.getElementById("v_lowlag").textContent = fmt(lastFinite(lowlag));
  document.getElementById("v_fair").textContent = fmt(lastFinite(fair));
  drawTimeAxis(scale, plotW);
}

function indicatorBounds(def, values) {
  let lo, hi;
  if (def.fixed) [lo, hi] = def.fixed;
  else {
    const fin = values.filter(Number.isFinite);
    if (!fin.length) { lo = -1; hi = 1; }
    else { lo = Math.min(...fin); hi = Math.max(...fin); if (hi - lo < 1e-9) { hi += 1; lo -= 1; } const p = (hi - lo) * 0.1; lo -= p; hi += p; }
  }
  if (def.style === "flow") { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi - lo < 1e-9) hi = lo + 1;
  return { lo, hi };
}

function renderIndicatorChart(slot, surfaceName) {
  useSurface(surfaceName);
  const plotW = cssW - PADL - PADR, plotH = cssH - PADT - PADB;
  const { X } = sampleX(plotW), def = INDICATOR_BY_ID[slot.id], values = slot.values;
  const { lo, hi } = indicatorBounds(def, values);
  const Yv = (v) => PADT + (1 - (v - lo) / (hi - lo)) * plotH;
  ctx.strokeStyle = "#232a33"; ctx.fillStyle = "#8b949e"; ctx.lineWidth = 1;
  ctx.font = "10px ui-monospace, Menlo, monospace"; ctx.textAlign = "left";
  for (let k = 0; k <= 2; k++) {
    const y = PADT + k / 2 * plotH;
    ctx.beginPath(); ctx.moveTo(PADL, y); ctx.lineTo(PADL + plotW, y); ctx.stroke();
  }
  ctx.fillText(fmtTick(hi), PADL + plotW + 6, PADT + 3);
  ctx.fillText(fmtTick(lo), PADL + plotW + 6, PADT + plotH + 3);
  if (def.refs) for (const r of def.refs) {
    if (r < lo || r > hi) continue;
    const y = Yv(r); ctx.strokeStyle = "#2c333d"; ctx.beginPath(); ctx.moveTo(PADL, y); ctx.lineTo(PADL + plotW, y); ctx.stroke();
    ctx.fillStyle = "#8b949e"; ctx.fillText(fmtTick(r), PADL + plotW + 6, y + 3);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(PADL, PADT, plotW, plotH); ctx.clip();
  if (def.style === "flow") {
    const zeroY = Yv(0);
    fillFlow(values, X, Yv, zeroY, "#3fb950", PADL, PADT, plotW, zeroY - PADT);
    fillFlow(values, X, Yv, zeroY, "#f85149", PADL, zeroY, plotW, PADT + plotH - zeroY);
  } else line(values, def.color || "#d29922", 1.8, 1, X, Yv);
  ctx.restore();
  const nowVal = lastFinite(values);
  return nowVal;
}

function indicatorValue(def, value) {
  if (!Number.isFinite(value)) return { text: "warming…", className: "" };
  if (def.style === "flow") {
    if (value > 0.05) return { text: "buyers " + Math.round(value * 100) + "%", className: "buy" };
    if (value < -0.05) return { text: "sellers " + Math.round(-value * 100) + "%", className: "sell" };
    return { text: "balanced", className: "" };
  }
  return { text: fmtTick(value), className: "" };
}

function renderIndicatorPanels() {
  indicatorSlots.forEach((slot) => {
    const def = INDICATOR_BY_ID[slot.id], value = renderIndicatorChart(slot, "indicator:" + slot.id);
    const meta = indicatorValue(def, value), valueEl = document.getElementById("indicator-value-" + slot.id);
    if (valueEl) { valueEl.textContent = meta.text; valueEl.className = "card-value" + (meta.className ? " " + meta.className : ""); }
  });
}

function buildIndicatorGrid() {
  const rail = document.getElementById("indicatorRail");
  rail.replaceChildren();
  indicatorCanvases.clear();
  const rows = new Map();
  const accents = {
    "Order flow & volume": "#58a6ff",
    "Momentum": "#d29922",
    "Trend": "#3fb950",
    "Volatility": "#f85149",
    "Cycle (Ehlers)": "#bc8cff",
  };
  indicatorSlots.forEach((slot) => {
    const def = INDICATOR_BY_ID[slot.id], surfaceName = "indicator:" + slot.id;
    let row = rows.get(def.group);
    if (!row) {
      const section = document.createElement("section"); section.className = "category-row";
      section.style.setProperty("--accent", accents[def.group] || "#8b949e");
      const heading = document.createElement("div"); heading.className = "category-row-head";
      const h2 = document.createElement("h2"); h2.textContent = def.group;
      const count = document.createElement("span"); count.textContent = "indicators";
      heading.append(h2, count);
      const track = document.createElement("div"); track.className = "category-track";
      section.append(heading, track); rail.appendChild(section);
      row = { section, track, count: 0 }; rows.set(def.group, row);
    }
    row.count += 1; row.countEl = row.countEl || row.section.querySelector(".category-row-head span");
    row.countEl.textContent = row.count + (row.count === 1 ? " indicator" : " indicators");
    const card = document.createElement("section"); card.className = "indicator-card";
    card.style.setProperty("--accent", accents[def.group] || "#8b949e");
    const head = document.createElement("div"); head.className = "card-head";
    const title = document.createElement("div"); title.className = "card-title";
    const h3 = document.createElement("h3"); h3.textContent = def.label;
    const sub = document.createElement("span"); sub.className = "card-sub"; sub.textContent = def.group;
    title.append(h3, sub);
    const value = document.createElement("span"); value.className = "card-value"; value.id = "indicator-value-" + def.id; value.textContent = "warming…";
    head.append(title, value);
    const surface = document.createElement("div"); surface.className = "indicator-surface";
    const canvas = document.createElement("canvas"); canvas.id = "indicator-chart-" + def.id;
    surface.appendChild(canvas); card.append(head, surface); row.track.appendChild(card);
    indicatorCanvases.set(surfaceName, canvas);
  });
  document.getElementById("indicatorCount").textContent = indicatorSlots.length;
}

function renderOHLC(X, Yp, plotW) {
  const barW = Math.max(1, Math.min(10, plotW / Math.max(N, 1) * 0.65));
  for (let i = 0; i < prices.length; i++) {
    if (![opens[i], highs[i], lows[i], prices[i]].every(Number.isFinite)) continue;
    const x = X(i), yOpen = Yp(opens[i]), yClose = Yp(prices[i]);
    const rising = prices[i] >= opens[i];
    ctx.strokeStyle = rising ? "#3fb950" : "#f85149";
    ctx.fillStyle = rising ? "rgba(63,185,80,.55)" : "rgba(248,81,73,.55)";
    ctx.beginPath(); ctx.moveTo(x, Yp(highs[i])); ctx.lineTo(x, Yp(lows[i])); ctx.stroke();
    ctx.fillRect(x - barW / 2, Math.min(yOpen, yClose), barW, Math.max(1, Math.abs(yClose - yOpen)));
  }
}

function renderVolume(top, height, X, plotW) {
  const totals = buyVol.map((v, i) => (Number.isFinite(v) ? Math.max(0, v) : 0) + (Number.isFinite(sellVol[i]) ? Math.max(0, sellVol[i]) : 0));
  const maxVol = Math.max(...totals, 0);
  ctx.fillStyle = "#8b949e"; ctx.textAlign = "left"; ctx.font = "11px ui-monospace, Menlo, monospace";
  ctx.fillText("volume", PADL + 2, top + 10);
  if (!(maxVol > 0)) return;
  ctx.fillText(fmtTick(maxVol), PADL + plotW + 8, top + 3);
  ctx.strokeStyle = "#2c333d"; ctx.beginPath(); ctx.moveTo(PADL, top + height); ctx.lineTo(PADL + plotW, top + height); ctx.stroke();
  const barW = Math.max(1, Math.min(10, plotW / Math.max(N, 1) * 0.7));
  for (let i = 0; i < totals.length; i++) {
    const x = X(i), totalH = totals[i] / maxVol * (height - 14);
    const buyH = (Math.max(0, buyVol[i]) / maxVol) * (height - 14);
    const sellH = totalH - buyH;
    ctx.fillStyle = "rgba(63,185,80,.75)"; ctx.fillRect(x - barW / 2, top + height - buyH, barW, buyH);
    ctx.fillStyle = "rgba(248,81,73,.75)"; ctx.fillRect(x - barW / 2, top + height - buyH - sellH, barW, sellH);
  }
}

function line(arr, color, w, alpha, X, Yp) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.globalAlpha = alpha; ctx.lineJoin = "round";
  ctx.beginPath(); let pen = false;
  for (let i = 0; i < arr.length; i++) {
    const v = arr[i];
    if (!Number.isFinite(v)) { pen = false; continue; }
    const x = X(i), y = Yp(v);
    if (pen) ctx.lineTo(x, y); else { ctx.moveTo(x, y); pen = true; }
  }
  ctx.stroke(); ctx.globalAlpha = 1;
}

// Fill the area between the line and the zero line, clipped so only the
// above-zero (green) or below-zero (red) part shows.
function fillFlow(arr, X, Yf, zeroY, color, cx, cy, cw, ch) {
  const len = arr.length; if (len < 2) return;
  ctx.save(); ctx.beginPath(); ctx.rect(cx, cy, cw, ch); ctx.clip();
  ctx.fillStyle = color; ctx.globalAlpha = 0.55; ctx.beginPath();
  ctx.moveTo(X(0), zeroY);
  for (let i = 0; i < len; i++) ctx.lineTo(X(i), Yf(Number.isFinite(arr[i]) ? arr[i] : 0));
  ctx.lineTo(X(len - 1), zeroY); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1; ctx.restore();
}

// ---------------------------------------------------------------------------
document.getElementById("source").addEventListener("change", (e) => switchFeed(e.target.value));
document.getElementById("timezone").addEventListener("change", (e) => { timeZone = e.target.value; dirty = true; updateTimeInfo(); });
document.getElementById("window").addEventListener("change", (e) => {
  const [t, n] = e.target.value.split(":");
  const next = t === "vol" ? { mode: "volume", factor: +n, N: 240 }
    : t === "time" ? { mode: "time", factor: +n, N: 240 }
    : { mode: "count", factor: 0, N: +n };
  clock = { mode: next.mode, factor: next.factor }; N = next.N;
  updateMarketTitle();
  rebuildFromBuffer();
});

buildIndicatorGrid();
updateMarketTitle();
resize();
connect();
requestAnimationFrame(render);
</script>
</body>
</html>
