name: Build wheels

# Release pipeline: test -> build -> publish, as dependent jobs so wheels are
# never built and nothing is ever published unless the test suite passes first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish built artifacts to TestPyPI (a dry run of the release pipeline via OIDC)"
        type: boolean
        default: false

# Cancel in-progress runs of the same workflow on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Opt every action into Node.js 24 immediately (silences the Node 20
# deprecation warnings on actions that haven't published a Node 24 major yet).
# MACOSX_DEPLOYMENT_TARGET=10.13: matches the floor enforced in CMakeLists.txt
# so the wheel filename reflects what the .so actually requires. Setting it at
# the workflow env level is the most reliable way -- cibuildwheel's per-platform
# `environment` field in pyproject.toml didn't propagate to the wheel-tagging
# step. cibuildwheel auto-bumps to 11.0 for arm64 builds.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  test:
    # Gate for the whole release: the full suite across every supported Python
    # on Linux. Python-version-specific bugs (e.g. the RollingZscore member-init
    # bug on CPython 3.14) are the ones that slip past a single-version run; each
    # built wheel is additionally smoke-tested per-platform by cibuildwheel's
    # test-command (pyproject [tool.cibuildwheel]).
    name: pytest (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas pytest pyyaml QuantLib TA-Lib

      - name: Build C++ extension
        run: make build

      - name: Run pytest
        run: pytest -q

  build_wheels:
    name: Wheels (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 (Apple Silicon) cross-compiles BOTH x86_64 and arm64 wheels
        # via cibuildwheel's archs=["x86_64","arm64"] in pyproject.toml.
        # macos-13 (Intel runners) is intentionally omitted -- GitHub Actions
        # has throttled Intel mac runners, and macos-14 covers x86_64 anyway.
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Build wheels
        # With nanobind's STABLE_ABI we build ONE abi3 wheel per platform on
        # CPython 3.12 (CIBW_BUILD cp312-* in pyproject [tool.cibuildwheel]).
        # The cp312-abi3 wheel installs on 3.12+. cibuildwheel's own
        # test-command smoke-tests it on 3.12; the full pytest run across
        # 3.12/3.13/3.14 happens in the test_wheels job below.
        uses: pypa/cibuildwheel@v4.1.0
        env:
          # Wheels must run on any CPU, so leave SCREAMER_NATIVE_ARCH off.
          CIBW_ENVIRONMENT: "SCREAMER_NATIVE_ARCH=OFF"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  test_wheels:
    # Prove the single abi3 wheel actually runs the full suite on every
    # supported Python, not just the 3.12 it was built on. Downloads the
    # built wheels, pip-installs the cp312-abi3 wheel into a 3.13 and 3.14
    # interpreter, and runs pytest against the installed package.
    name: test wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/download-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse

      - name: Install the abi3 wheel + test deps
        # Install screamer from the built wheel only (--no-index against the
        # wheelhouse), then the test deps from PyPI. QuantLib/TA-Lib supply the
        # cross-validation references; they are best-effort so a missing wheel
        # on a brand-new Python (e.g. 3.14) skips those tests rather than
        # failing the job.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheelhouse screamer
          python -m pip install numpy scipy pandas pytest pyyaml
          python -m pip install QuantLib TA-Lib || echo "QuantLib/TA-Lib unavailable on this Python; validation tests will skip"

      - name: Run pytest against the installed wheel
        # Remove the in-tree screamer/ source package so `import screamer`
        # resolves to the pip-installed abi3 wheel rather than shadowing it
        # with a source dir that carries no compiled extension. The tests
        # under tests/ then exercise the shipped artifact.
        shell: bash
        run: |
          rm -rf screamer
          pytest -q

  build_sdist:
    name: Source distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  github_release:
    name: Attach to GitHub Release
    needs: [build_wheels, build_sdist, test_wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish_pypi:
    name: Publish to PyPI (OIDC)
    needs: [build_wheels, build_sdist, test_wheels]
    runs-on: ubuntu-latest
    # Real releases only: a pushed version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/screamer/
    permissions:
      id-token: write   # Trusted Publishing: PyPI verifies this workflow via OIDC
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        # No username/password/token: with id-token write and a trusted
        # publisher configured on pypi.org (repo screamer-labs/screamer, workflow
        # build-wheels.yml, environment pypi), the action mints a short-lived
        # OIDC token automatically.
        uses: pypa/gh-action-pypi-publish@release/v1

  publish_testpypi:
    name: Publish to TestPyPI (OIDC dry run)
    needs: [build_wheels, build_sdist, test_wheels]
    runs-on: ubuntu-latest
    # Manual dry run only: workflow_dispatch with testpypi=true. Requires a
    # separate trusted publisher configured on test.pypi.org.
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    environment:
      name: testpypi
      url: https://test.pypi.org/project/screamer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
