# Temporary: find which construct crashes Apple clang 15 (Xcode 15.4) when
# the macOS wheels are built. Removed once the crash is fixed.
name: Debug clang 15 crash

on:
  push:
    branches: [feat/shape-contract]
    paths: ['.github/workflows/debug-clang15.yml', 'include/**', 'bindings/**']

jobs:
  compile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure
        run: |
          clang++ --version
          pip install ninja cmake
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DSCREAMER_NATIVE_ARCH=OFF -DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')
      - name: Compile every binding file, keep going
        continue-on-error: true
        run: |
          cd build
          for t in $(ninja -t targets all | grep -o 'CMakeFiles/screamer_bindings.dir/bindings/[a-z_]*\.cpp\.o'); do
            if ninja "$t" > "/tmp/$(basename $t).log" 2>&1; then echo "OK   $t"; else echo "FAIL $t"; fi
          done
      - name: Crash backtraces
        if: always()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/clang*; do
            [ -e "$f" ] || continue
            echo "=== $f"; grep -A60 -E "Thread [0-9]+ Crashed|crashed" "$f" | head -90
          done
          ls /var/folders/*/*/T/*.sh 2>/dev/null | head -3 | xargs -I{} sh -c 'echo "=== {}"; tail -5 {}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: clang-crash-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ~/Library/Logs/DiagnosticReports/clang*
            /tmp/*.log
          if-no-files-found: ignore
