[pytest]
addopts = --ignore=_skbuild
# The suite lives entirely under tests/. Scoping collection here keeps a bare
# `pytest -q` (local and CI) from wandering into scratch artifacts elsewhere in
# the tree, e.g. docs/superpowers/spikes/*/smoke_test.py, which import
# throwaway spike-only modules. nbmake passes an explicit docs/notebooks/ path,
# so it is unaffected.
testpaths = tests
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format=%Y-%m-%d %H:%M:%S